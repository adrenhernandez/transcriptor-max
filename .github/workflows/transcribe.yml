name: Transcribir
run-name: ${{ inputs.key }} · ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: Link del video de YouTube
        required: true
        type: string
      key:
        description: Nombre del archivo de resultado
        required: true
        type: string
      nonce:
        description: Identificador de esta ejecución
        required: true
        type: string
      language:
        description: Código de idioma (vacío = automático)
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp necesita un runtime de JavaScript para resolver los retos de YouTube
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias
        run: |
          pip install -q -U "yt-dlp[default]" requests
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Descargar y transcribir
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          VIDEO_URL: ${{ inputs.url }}
          KEY: ${{ inputs.key }}
          NONCE: ${{ inputs.nonce }}
          LANGUAGE: ${{ inputs.language }}
        run: python scripts/transcribe.py

      - name: Guardar resultado en la rama data
        if: always()
        env:
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/result.json" ] || exit 0
          [[ "$KEY" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "Clave inválida: $KEY"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          save() {
            mkdir -p transcripts
            cp "$RUNNER_TEMP/result.json" "transcripts/$KEY.json"
            git add "transcripts/$KEY.json"
            git commit -q -m "Transcripción $KEY" || true
          }

          if git fetch -q --depth=1 origin data; then
            git checkout -q -B data FETCH_HEAD
          else
            git switch -q --orphan data
          fi
          save
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:data && exit 0
            sleep $((i * 3))
            git fetch -q --depth=1 origin data && git reset -q --hard FETCH_HEAD
            save
          done
          exit 1
