<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcriptor Max</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111'/><path d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --accent: #1c1917; --accent-text: #fafaf9;
    --error: #b91c1c; --error-bg: #fef2f2; --focus: #a8a29e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --accent: #f5f5f4; --accent-text: #0c0a09;
      --error: #fca5a5; --error-bg: #2a1212; --focus: #57534e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 680px; margin: 0 auto; padding: 72px 16px 96px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  h1 span { color: var(--muted); font-weight: 400; }
  .icon-btn {
    background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px;
    border-radius: 8px; display: inline-flex;
  }
  .icon-btn:hover { color: var(--text); background: var(--border); }

  form { display: flex; gap: 8px; }
  input, select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; min-width: 0;
  }
  input:focus, select:focus { outline: none; border-color: var(--focus); }
  #url { flex: 1; }
  #lang { width: 132px; color: var(--muted); }
  button.primary {
    font: inherit; font-weight: 500; background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; white-space: nowrap;
  }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.ghost {
    font: inherit; font-size: 14px; background: none; color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button.ghost:hover { color: var(--text); }

  #settings {
    margin-top: 16px; padding: 18px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--surface); display: grid; gap: 12px;
  }
  #settings h3 { margin: 0; font-size: 16px; font-weight: 600; }
  #settings label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; color: var(--text); }
  #settings p { margin: 0; font-size: 13px; color: var(--muted); }
  #settings a { color: inherit; }

  #status { margin-top: 28px; color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 10px; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--muted);
    border-radius: 50%; animation: spin .8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status.error { color: var(--error); background: var(--error-bg); padding: 12px 14px; border-radius: 10px; display: block; }
  #status a { color: inherit; }

  #result { margin-top: 40px; }
  #result h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; line-height: 1.35; }
  #result h2 a { color: inherit; text-decoration: none; }
  #result h2 a:hover { text-decoration: underline; }
  .meta { font-size: 14px; color: var(--muted); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 18px 0 8px; }
  .actions { display: flex; gap: 8px; }
  #text {
    border-top: 1px solid var(--border); padding-top: 20px; font-size: 16.5px; line-height: 1.75;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #text p { margin: 0 0 1.1em; }
  [hidden] { display: none !important; }

  @media (max-width: 560px) {
    main { padding-top: 40px; }
    form { flex-wrap: wrap; }
    #url { flex-basis: 100%; }
    #lang { flex: 1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Transcriptor <span>Max</span></h1>
    <button class="icon-btn" id="gear" title="Configuración" aria-label="Configuración">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <form id="form" autocomplete="off">
    <input id="url" type="url" placeholder="Pega el link de YouTube" required>
    <select id="lang" title="Idioma del video">
      <option value="">Auto</option>
      <option value="es">Español</option>
      <option value="en">Inglés</option>
      <option value="pt">Portugués</option>
      <option value="fr">Francés</option>
      <option value="it">Italiano</option>
      <option value="de">Alemán</option>
    </select>
    <button class="primary" id="go" type="submit">Transcribir</button>
  </form>

  <section id="settings" hidden>
    <h3>Configuración</h3>
    <label>1. Repositorio
      <input id="repo" placeholder="usuario/transcriptor-max">
    </label>
    <label>2. Token de GitHub
      <input id="token" type="password" placeholder="Pega aquí tu token (empieza con github_pat_)">
    </label>
    <p>Token <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained</a> solo para este repo, con permisos <b>Actions: read &amp; write</b> y <b>Contents: read</b>. Se guarda únicamente en este navegador.</p>
    <div><button class="primary" id="save" type="button">Guardar</button></div>
  </section>

  <div id="status" hidden></div>

  <article id="result" hidden>
    <h2><a id="title" target="_blank" rel="noopener"></a></h2>
    <div class="meta" id="meta"></div>
    <div class="bar">
      <span class="meta" id="words"></span>
      <div class="actions">
        <button class="ghost" id="redo" type="button" title="Volver a transcribir">Repetir</button>
        <button class="ghost" id="copy" type="button">Copiar</button>
      </div>
    </div>
    <div id="text"></div>
  </article>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const WORKFLOW = "transcribe.yml";
const POLL_MS = 5000;
const MAX_WAIT_MS = 70 * 60 * 1000;

function defaultRepo() {
  const h = location.hostname;
  if (h.endsWith(".github.io")) {
    const owner = h.split(".")[0];
    const name = location.pathname.split("/").filter(Boolean)[0] || h;
    return `${owner}/${name}`;
  }
  return "";
}

const cfg = () => ({ repo: store.get("tm.repo") || defaultRepo(), token: store.get("tm.token") });

$("repo").value = cfg().repo;
$("token").value = cfg().token;
$("gear").onclick = () => { $("settings").hidden = !$("settings").hidden; };
$("save").onclick = () => {
  store.set("tm.repo", $("repo").value.trim());
  store.set("tm.token", $("token").value.trim());
  $("settings").hidden = true;
  showStatus("Configuración guardada.");
};
if (!cfg().token || !cfg().repo) $("settings").hidden = false;

async function gh(path, opts = {}) {
  const { repo, token } = cfg();
  const res = await fetch(`https://api.github.com/repos/${repo}${path}`, {
    cache: "no-store",
    ...opts,
    headers: {
      Authorization: `Bearer ${token}`,
      "X-GitHub-Api-Version": "2022-11-28",
      Accept: "application/vnd.github+json",
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) throw new Error("Token inválido o vencido. Revísalo en la configuración (⚙).");
  return res;
}

async function readResult(key) {
  const res = await gh(`/contents/transcripts/${key}.json?ref=data`, {
    headers: { Accept: "application/vnd.github.raw+json" },
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub respondió ${res.status} al leer el resultado.`);
  return res.json();
}

function videoId(raw) {
  try {
    const u = new URL(raw.trim());
    const host = u.hostname.replace(/^(www|m|music)\./, "");
    let id = null;
    if (host === "youtu.be") id = u.pathname.slice(1);
    else if (host === "youtube.com" || host === "youtube-nocookie.com") {
      id = u.searchParams.get("v") || (u.pathname.match(/^\/(?:shorts|live|embed|v)\/([^/?#]+)/) || [])[1];
    }
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  } catch { return null; }
}

function showStatus(msg, { loading = false, error = false } = {}) {
  const el = $("status");
  el.hidden = !msg;
  el.className = error ? "error" : "";
  el.innerHTML = "";
  if (loading) el.append(Object.assign(document.createElement("span"), { className: "spinner" }));
  const span = document.createElement("span");
  if (msg instanceof Node) span.append(msg); else span.textContent = msg;
  el.append(span);
}

function fmtDuration(s) {
  if (!s) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h} h ${m} min` : m ? `${m} min ${sec ? sec + " s" : ""}`.trim() : `${sec} s`;
}

const LANGS = { spanish: "español", english: "inglés", portuguese: "portugués", french: "francés",
  italian: "italiano", german: "alemán", es: "español", en: "inglés", pt: "portugués", fr: "francés", it: "italiano", de: "alemán" };

function showResult(r) {
  $("title").textContent = r.title || r.url;
  $("title").href = r.url;
  $("meta").textContent = [r.channel, fmtDuration(r.duration), LANGS[r.language] || r.language]
    .filter(Boolean).join(" · ");
  const text = r.text || "";
  $("words").textContent = `${text.split(/\s+/).filter(Boolean).length.toLocaleString("es")} palabras`;
  const box = $("text");
  box.innerHTML = "";
  for (const p of text.split(/\n{2,}/)) box.append(Object.assign(document.createElement("p"), { textContent: p }));
  if (!text) box.append(Object.assign(document.createElement("p"), { textContent: "No se detectó voz en el video." }));
  $("result").hidden = false;
  $("copy").onclick = async () => {
    await navigator.clipboard.writeText(text);
    $("copy").textContent = "¡Copiado!";
    setTimeout(() => ($("copy").textContent = "Copiar"), 1600);
  };
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let current = null;

async function run(force = false) {
  const { repo, token } = cfg();
  if (!repo || !token) { $("settings").hidden = false; showStatus("Primero configura el repositorio y tu token.", { error: true }); return; }
  const id = videoId($("url").value);
  if (!id) { showStatus("Ese link no parece un video de YouTube.", { error: true }); return; }

  const lang = $("lang").value;
  const key = lang ? `${id}_${lang}` : id;
  const url = `https://www.youtube.com/watch?v=${id}`;
  const job = (current = {});
  $("go").disabled = true;
  $("result").hidden = true;
  $("redo").onclick = () => run(true);

  try {
    if (!force) {
      showStatus("Buscando…", { loading: true });
      const cached = await readResult(key);
      if (cached && !cached.error) { showStatus(""); showResult(cached); return; }
    }

    const nonce = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const res = await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {
      method: "POST",
      body: JSON.stringify({ ref: "main", inputs: { url, key, nonce, language: lang } }),
    });
    if (res.status === 403 || res.status === 404) throw new Error("El token no tiene permiso de Actions (read & write) sobre este repositorio.");
    if (!res.ok) throw new Error(`No se pudo iniciar la transcripción (GitHub ${res.status}).`);

    const start = Date.now();
    let runInfo = null;
    while (job === current) {
      const elapsed = Math.round((Date.now() - start) / 1000);
      const clock = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, "0")}`;
      if (Date.now() - start > MAX_WAIT_MS) throw new Error("Se agotó el tiempo de espera.");

      const runs = await gh(`/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=20`).then((r) => r.json());
      runInfo = (runs.workflow_runs || []).find((x) => (x.display_title || "").includes(nonce)) || runInfo;

      if (!runInfo || runInfo.status === "queued" || runInfo.status === "waiting" || runInfo.status === "pending") {
        showStatus(`En cola… ${clock}`, { loading: true });
      } else if (runInfo.status !== "completed") {
        showStatus(`Descargando audio y transcribiendo con Whisper… ${clock}`, { loading: true });
      } else {
        const r = await readResult(key);
        if (r && r.nonce === nonce) {
          if (r.error) throw Object.assign(new Error(r.error), { runUrl: runInfo.html_url });
          showStatus("");
          showResult(r);
          return;
        }
        if (runInfo.conclusion !== "success") {
          throw Object.assign(new Error("La transcripción falló."), { runUrl: runInfo.html_url });
        }
        showStatus(`Guardando… ${clock}`, { loading: true });
      }
      await sleep(POLL_MS);
    }
  } catch (e) {
    if (job !== current) return;
    const frag = document.createDocumentFragment();
    frag.append(e.message);
    if (e.runUrl) {
      frag.append(" ");
      frag.append(Object.assign(document.createElement("a"), { href: e.runUrl, target: "_blank", rel: "noopener", textContent: "Ver detalles" }));
    }
    showStatus(frag, { error: true });
  } finally {
    if (job === current) $("go").disabled = false;
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); run(); };
</script>
</body>
</html>
